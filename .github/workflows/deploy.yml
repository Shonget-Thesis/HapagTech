name: CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations
        env:
          DATABASE_URL: sqlite:///db.sqlite3
        run: python manage.py migrate

      - name: Run Django tests
        env:
          DATABASE_URL: sqlite:///db.sqlite3
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python manage.py test

  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Cypress and wait-on
        run: npm install cypress wait-on --save-dev

      - name: Start frontend server
        run: npm run dev -- --host 0.0.0.0 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173

      - name: Run Cypress tests
        run: npx cypress run

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

  selenium-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8000 &

      - name: Wait for Django
        run: |
          python -m pip install requests
          python - <<EOF
          import requests,time
          for _ in range(30):
              try:
                  requests.get("http://localhost:8000/login")
                  print("Django ready")
                  break
              except:
                  time.sleep(2)
          EOF

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium tests
        env:
          DATABASE_URL: sqlite:///db.sqlite3
        run: |
          python -m unittest discover -s tests/selenium

      - name: Upload Selenium logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selenium-logs
          path: backend/tests/selenium/logs

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs:
      - backend-tests
      - cypress-tests
      - selenium-tests

    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes

  deploy-backend:
    name: Deploy Backend to Vercel
    needs:
      - deploy-frontend

    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd backend
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes

  smoke-test:
    name: Smoke Test
    needs:
      - deploy-frontend
      - deploy-backend

    runs-on: ubuntu-latest

    steps:
      - name: Validate production homepage
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          curl -fsS "$PRODUCTION_URL" >/dev/null
          curl -fsS "$PRODUCTION_URL/login" >/dev/null